{{ define "main" }}
<section class="section container">
  <div class="section-header">
    <div>
      <h1 class="section-title">{{ .Title }}</h1>
      {{ with .Description }}<p class="section-subtitle">{{ . }}</p>{{ end }}
    </div>
  </div>
  <article class="card">
    {{ .Content }}
  </article>
</section>
{{ end }}
